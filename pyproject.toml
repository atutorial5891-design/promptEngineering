[project]
name = "prompt-engineering-mastery"
version = "0.1.0"
description = "Private learning hub: prompt engineering learning path, design docs, study materials, and labs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
docs = [
    # MkDocs 2.0 drops the plugin system; stay on 1.x (migration path: Zensical)
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocs-awesome-nav>=3.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
]
labs = [
    "litellm>=1.50",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jupyter>=1.0",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[tool.uv]
default-groups = ["docs", "labs", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pem"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
